<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F&amp;H STUDIOS</title>
  <meta name="description" content="F&amp;H STUDIOS - Android uygulamaları geliştiricisi.">
  <style>
    :root { --bg:#0E1116; --panel:#171C26; --border:#2A3344; --text:#E8ECF3; --muted:#8A93A6; --accent:#F5A524; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:720px; margin:0 auto; padding:48px 20px; }
    h1 { font-size:32px; margin:0 0 4px; letter-spacing:.5px; }
    .sub { color:var(--muted); margin:0 0 32px; }
    h2 { font-size:13px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin:32px 0 12px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:12px; }
    .card h3 { margin:0 0 4px; font-size:18px; }
    .card p { margin:0 0 10px; color:var(--muted); }
    a { color:var(--accent); text-decoration:none; font-weight:600; }
    a:hover { text-decoration:underline; }
    .links a { margin-right:16px; }
    footer { margin-top:40px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>F&amp;H STUDIOS</h1>
    <p class="sub">Android için sade ve kullanışlı uygulamalar.</p>

    <h2>Uygulamalar</h2>
    <div class="card">
      <h3>Yol Arkadaşım</h3>
      <p>Yakıt tüketimi takibi, güncel yakıt fiyatları, araç garajı ve servis hatırlatıcıları.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.yolarkadasim.app">Google Play</a>
        <a href="https://sites.google.com/view/yolarkada/ana-sayfa">Uygulama sayfası</a>
      </div>
    </div>

    <h2>İletişim</h2>
    <div class="card">
      <p>Hata bildirimi, öneri ve sorularınız için:</p>
      <a href="mailto:fhstudiios@gmail.com">fhstudiios@gmail.com</a>
    </div>

    <footer>© F&amp;H STUDIOS</footer>
  </main>
</body>
</html>
